# Create a thick jail on FreeBSD 14.2
bastille create gitc 14.2-RELEASE 10.17.89.10

# Port mapping  8080:80  →  RDR rule
bastille rdr gitc tcp 8080 80

# Volumes: bind-mount host paths into the jail (equivalent of ./repos and ./src)
bastille mount gitc /host/path/repos /repos nullfs rw 0 0
bastille mount gitc /host/path/src   /var/www/cgi-bin nullfs ro 0 0

# Apply the template (equivalent of `docker build`)
bastille template gitc path/to/gitc-template

# restart: unless-stopped  →  set the jail to start at boot
sysrc -f /usr/local/etc/bastille/bastille.conf bastille_list+=gitc
